<style>
:root{--navy:#0b1930;--navy2:#10294c;--blue:#2563eb;--teal:#0f766e;--green:#16a34a;--red:#dc2626;--amber:#d97706;--purple:#7c3aed;--bg:#f2f6fb;--card:#fff;--text:#142338;--muted:#65758b;--line:#dce6f2;--shadow:0 12px 34px rgba(15,23,42,.08);--r:18px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font:15.5px/1.55 Inter,Arial,"Segoe UI",sans-serif;color:var(--text);background:linear-gradient(180deg,#f8fbff,#eef4fb)}button,input,select{font:inherit}.hidden{display:none!important}.muted{color:var(--muted)}
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,var(--navy),#0b2342);color:#e5edf7;padding:18px 13px;overflow:auto}.brand{display:flex;gap:11px;align-items:center;padding:8px 8px 18px;border-bottom:1px solid rgba(255,255,255,.1)}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#2f6df6,#0d9488);display:grid;place-items:center;font-size:23px;box-shadow:0 10px 20px rgba(0,0,0,.2)}.brand b{display:block;font-size:14px}.brand small{color:#9db0c8}.sec{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#7f94ae;margin:20px 10px 7px;font-weight:900}.nav{width:100%;border:1px solid transparent;background:transparent;color:#c7d4e5;border-radius:12px;padding:10px 11px;text-align:left;display:flex;gap:10px;align-items:center;margin:3px 0;cursor:pointer}.nav:hover{background:rgba(255,255,255,.06)}.nav.active{background:linear-gradient(90deg,rgba(37,99,235,.3),rgba(15,118,110,.12));border-color:rgba(147,197,253,.3);color:#fff;font-weight:800}.badge{margin-left:auto;background:#18365f;border:1px solid rgba(255,255,255,.12);padding:1px 7px;border-radius:999px;font-size:11px}.main{min-width:0}.top{height:68px;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:14px;position:sticky;top:0;z-index:20}.top h1{font-size:17px;margin:0}.top .spacer{flex:1}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:12px}.content{padding:24px;max-width:1500px;margin:auto}.view{display:none}.view.active{display:block}.pagehead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.pagehead h2{font-size:28px;line-height:1.18;margin:0}.pagehead p{margin:7px 0 0;color:var(--muted);max-width:900px}.card{position:relative;background:linear-gradient(180deg,#fff,#fcfeff);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;overflow:hidden}.card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#2563eb,#0f766e,#7c3aed)}.grid{display:grid;gap:15px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{display:grid;grid-template-columns:1.4fr .7fr;gap:20px;background:linear-gradient(130deg,#eaf2ff,#f2fffb 55%,#f5efff);min-height:220px}.hero h2{font-size:31px;margin:0 0 8px}.atomviz{display:grid;place-items:center;min-height:180px;position:relative}.nucleus{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffdb66,#ef4444 55%,#991b1b);box-shadow:0 0 0 12px rgba(239,68,68,.08),0 14px 30px rgba(15,23,42,.15)}.orbit{position:absolute;width:180px;height:70px;border:2px solid rgba(37,99,235,.45);border-radius:50%;transform:rotate(25deg)}.orbit.o2{transform:rotate(-25deg)}.electron{position:absolute;width:15px;height:15px;border-radius:50%;background:#2563eb;left:18px;top:26px;box-shadow:0 0 0 5px rgba(37,99,235,.12)}.stat strong{font-size:28px;display:block}.stat span{color:var(--muted);font-size:12px}.tag{display:inline-flex;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:800}.blue{background:#eaf2ff;color:#1e40af}.green{background:#ecfdf3;color:#166534}.purple{background:#f3e8ff;color:#6b21a8}.amber{background:#fff7e6;color:#92400e}.red{background:#fef2f2;color:#991b1b}.btn{border:0;border-radius:12px;min-height:42px;padding:9px 14px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}.primary{background:#2563eb;color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:var(--text)}.success{background:#16a34a;color:#fff}.danger{background:#dc2626;color:#fff}.purpleBtn{background:#7c3aed;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.module{min-height:245px;display:flex;flex-direction:column}.module .num{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#eaf2ff;color:#1d4ed8;font-weight:900}.module h3{margin:12px 0 5px}.module p{margin:0 0 12px;color:var(--muted)}.module .actions{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}.progress{height:10px;background:#e8eef6;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#0f766e)}
.formulaHero{background:linear-gradient(135deg,#0b1930,#112e53 60%,#0f766e);color:#fff;padding:22px;border-radius:20px;box-shadow:0 16px 36px rgba(11,25,48,.18)}.formulaHero h3{margin:0 0 6px}.formulaBig{font:800 27px/1.6 "Times New Roman",serif;text-align:center;padding:15px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);border-radius:14px;margin-top:14px}.formulaGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:14px}.fbox{border:1px solid var(--line);border-radius:15px;background:#fff;padding:14px}.fbox h4{margin:0 0 8px}.fbox ul{padding-left:18px;margin:0}.timeline{display:grid;gap:11px}.timeitem{display:grid;grid-template-columns:80px 1fr;gap:13px;border-left:3px solid #2563eb;padding:9px 12px;background:#f8fbff;border-radius:0 12px 12px 0}.timeitem b{color:#1d4ed8}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.table th{font-size:12px;color:var(--muted);background:#f8fbff}.qwrap{max-width:920px;margin:auto}.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.qtext{font:700 20px/1.55 "Times New Roman",serif;background:#fbfdff;border:1px solid var(--line);border-left:5px solid #2563eb;border-radius:15px;padding:16px;margin:14px 0}.opt{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:14px;min-height:56px;padding:11px 13px;display:flex;align-items:center;gap:11px;margin:8px 0;text-align:left;cursor:pointer}.opt:hover{border-color:#93c5fd;transform:translateY(-1px)}.opt.sel{border-color:#2563eb;background:#eff6ff}.opt.ok{border-color:#16a34a;background:#ecfdf3}.opt.bad{border-color:#dc2626;background:#fef2f2}.letter{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-weight:900;flex:0 0 auto}.feedback{margin-top:14px;border:1px solid var(--line);border-radius:15px;padding:15px;background:#fff}.explain{border-left:5px solid #0f766e;background:#f0fdfa}.warning{border-left:5px solid #dc2626;background:#fff7f7}.actionsRow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}.sourcegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.sourceitem{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}.wrongitem{border:1px solid var(--line);border-radius:14px;padding:13px;margin:9px 0}.modalbg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:grid;place-items:center;padding:16px;z-index:80}.modal{width:min(760px,96vw);max-height:88vh;overflow:auto;background:#fff;border-radius:20px;padding:20px;box-shadow:0 30px 70px rgba(0,0,0,.25)}.toast{position:fixed;right:20px;bottom:20px;background:#0b1930;color:#fff;padding:11px 14px;border-radius:12px;z-index:100;box-shadow:0 16px 30px rgba(0,0,0,.2)}.mobile{display:none}
@media(max-width:1050px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.formulaGrid{grid-template-columns:1fr}.hero{grid-template-columns:1fr}}
@media(max-width:820px){.shell{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:70;transform:translateX(-102%);transition:.2s}.side.open{transform:none}.mobile{display:inline-flex}.content{padding:16px}.top{padding:0 12px}.top h1{font-size:14px}.g4,.g3,.g2,.sourcegrid{grid-template-columns:1fr}.pagehead{flex-direction:column}.qtext{font-size:18px}}

.analysisBox{margin:12px 0 14px;border:1px solid #cbdcf3;border-radius:16px;background:linear-gradient(135deg,#f8fbff 0%,#f4f8ff 52%,#f5fffc 100%);overflow:hidden}.analysisBox summary{cursor:pointer;list-style:none;padding:13px 15px;font-weight:900;color:#173b68;display:flex;align-items:center;gap:9px}.analysisBox summary::-webkit-details-marker{display:none}.analysisBox summary:after{content:'▾';margin-left:auto;color:#64748b;transition:.2s}.analysisBox[open] summary:after{transform:rotate(180deg)}.analysisBody{padding:0 15px 15px}.analysisGrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.analysisCard{border:1px solid #d9e5f2;border-radius:13px;background:#fff;padding:12px}.analysisCard h4{margin:0 0 7px;font-size:14px}.analysisCard p{margin:5px 0;font-size:14px;line-height:1.55}.analysisCard.reverse{border-color:#c4b5fd;background:linear-gradient(180deg,#faf7ff,#fff)}.analysisArrow{font-family:"Times New Roman",serif;font-weight:800;color:#5b21b6;padding:8px 10px;border-radius:10px;background:#f3e8ff;margin:8px 0}.analysisSteps{margin:0;padding-left:19px}.analysisSteps li{margin:5px 0}.analysisHint{margin-top:10px;padding:9px 11px;border-radius:10px;background:#fff7ed;border:1px solid #fed7aa;font-size:13px;color:#7c2d12}@media(max-width:720px){.analysisGrid{grid-template-columns:1fr}}

'use strict';
const SOURCE=[{"id":"R1","set":"Ôn tập gốc","num":1,"type":"mc","text":"Các hạt cấu tạo nên hầu hết các nguyên tử là những loại hạt nào sau đây?","opts":["electron và proton.","neutron và electron.","proton và neutron.","electron, proton và neutron."],"a":3},{"id":"R2","set":"Ôn tập gốc","num":2,"type":"mc","text":"Các hạt cấu tạo nên hạt nhân của hầu hết các nguyên tử là những hạt nào?","opts":["electron và proton.","neutron và electron.","proton và neutron.","electron, proton và neutron."],"a":2},{"id":"R3","set":"Ôn tập gốc","num":3,"type":"mc","text":"Loại hạt được tìm thấy trong vỏ nguyên tử và mang điện tích âm?","opts":["Electron.","Neutron.","Proton.","Photon."],"a":0},{"id":"R4","set":"Ôn tập gốc","num":4,"type":"mc","text":"Loại hạt được tìm thấy trong hạt nhân và không mang điện?","opts":["Electron.","Neutron.","Proton.","Photon."],"a":1},{"id":"R5","set":"Ôn tập gốc","num":5,"type":"mc","text":"Loại hạt được tìm thấy trong hạt nhân và mang điện tích dương?","opts":["Electron.","Neutron.","Proton.","Photon."],"a":2},{"id":"R6","set":"Ôn tập gốc","num":6,"type":"mc","text":"Trong nguyên tử, hạt mang điện là","opts":["proton và neutron.","neutron và electron.","electron và proton.","electron, proton và neutron."],"a":2},{"id":"R7","set":"Ôn tập gốc","num":7,"type":"mc","text":"Nguyên tử là phần tử nhỏ nhất của chất và có đặc điểm nào sau đây?","opts":["không mang điện.","mang điện tích dương.","mang điện tích âm.","có thể mang điện hoặc không mang điện."],"a":0},{"id":"R8","set":"Ôn tập gốc","num":8,"type":"mc","text":"Trường hợp nào sau đây có sự tương ứng giữa hạt cơ bản với khối lượng và điện tích của chúng?","opts":["proton, m ≈ 0,00055 amu, q = +1.","neutron, m ≈ 1 amu, q = 0.","electron, m ≈ 1 amu, q = -1.","proton, m ≈ 1 amu, q = -1."],"a":1},{"id":"R9","set":"Ôn tập gốc","num":9,"type":"mc","text":"Qui ước lấy amu (hay đvC) làm khối lượng nguyên tử. Một amu có khối lượng bằng:","opts":["9,109.10-31 g.","1,661.10-25 kg.","9,109.10-27 kg.","1,661.10-2 ,"text":"Nguyên tử của nguyên tố X có tổng số hạt cơ bản là 52. Số hạt không mang điện gấp 1,06 lần số hạt mang điện âm. Số proton của nguyên tử nguyên tố X là","opts":["16.","17.","35.","52."],"a":1},{"id":"R19","set":"Ôn tập gốc","num":19,"type":"mc","text":"Tổng số hạt proton, electron và neutron trong nguyên tử của nguyên tố X là 10. Số khối của X là","opts":["3.","4.","6.","7."],"a":3},{"id":"R20","set":"Ôn tập gốc","num":20,"type":"mc","text":"Tổng số electron, proton và neutron trong một phân tử H2O là bao nhiêu? Biết trong phân tử này, nguyên tử H chỉ được tạo nên từ 1 proton và 1 electron, nguyên tử O có 8 proton và 8 neutron.","opts":["20.","24.","28.","30."],"a":2},{"id":"R21","set":"Ôn tập gốc","num":21,"type":"mc","text":"Nitrogen giúp bảo quản tinh trùng, phôi, máu và tế bào gốc. Biết nguyên tử nitrogen có tổng số hạt là 21 trong đó số hạt không mang điện chiếm 33,33%. Số đơn vị điện tích hạt nhân của nguyên tử Nitrogen là","opts":["4.","7.","6.","5."],"a":1},{"id":"R22","set":"Ôn tập gốc","num":22,"type":"mc","text":"Cho 1 mol kim loại X. Phát biểu nào dưới đây đúng?","opts":["1 mol X chứa số lượng nguyên tử bằng số lượng nguyên tử trong 1 mol nguyên tử hydrogen.","1 mol X chứa số lượng nguyên tử bằng số lượng nguyên tử trong 1/12 mol carbon.","1 mol X có khối lượng bằng khối lượng 1 mol hydrogen.","1 mol X có khối lượng bằng ½ khối lượng 1 mol carbon."],"a":0},{"id":"R23","set":"Ôn tập gốc","num":23,"type":"mc","text":"Nguyên tử R có điện tích lớp vỏ nguyên tử là -41,6.10-19C. Phát biểu nào sau đây là không chính xác?","opts":["Lớp vỏ nguyên tử R có 26 electron.","Hạt nhân nguyên tử R có 26 proton.","Hạt nhân nguyên tử R có 26 electron.","Nguyên tử R trung hòa về điện."],"a":2},{"id":"R24","set":"Ôn tập gốc","num":24,"type":"mc","text":"Số đơn vị điện tích hạt nhân của nguyên tử X là 53. Nguyên tử chứa","opts":["53 electron và 53 proton.","53 electron và 53 neutron.","53 proton và 53 neutron.","53 neutron."],"a":0},{"id":"R25","set":"Ôn tập gốc","num ối lượng gần bằng khối lượng hạt nhân."],"a":1},{"id":"S27","set":"Tự luyện gốc","num":27,"type":"mc","text":"Phát biểu nào sai khi nói về neutron?","opts":["Tồn tại trong hạt nhân nguyên tử.","Có khối lượng lớn hơn khối lượng electron.","Có khối lượng lượng bằng khối lượng proton.","Không mang điện."],"a":2},{"id":"S28","set":"Tự luyện gốc","num":28,"type":"mc","text":"Phát biểu nào sau đây là đúng khi nói về nguyên tử?","opts":["Trong nguyên tử, số hạt proton luôn bằng số hạt neutron.","Điện tích của một nguyên tử có thể có giá trị âm, dương hoặc bằng 0.","Khối lượng của một nguyên tử (tính theo amu) luôn là số nguyên.","Lớp vỏ nguyên tử tạo nên bởi các electron."],"a":3},{"id":"S29","set":"Tự luyện gốc","num":29,"type":"mc","text":"Cho các phát biểu sau: (1) Tất cả các hạt nhân nguyên tử đều được cấu tạo từ các hạt proton và neutron.","opts":["1.","4.","3.","2."],"a":3},{"id":"S30","set":"Tự luyện gốc","num":30,"type":"mc","text":"Cho các phát biểu sau: (a) Nếu 1 nguyên tử có 17 electron thì nguyên tử đó cũng có 17 proton. (b) Nếu 1 nguyên tử có 17 electron thì nguyên tử đó cũng có 17 neutron. (c) Nếu 1 nguyên tử có 17 electron thì ion tạo ra từ nguyên tố đó có 17 proton. (d) Nếu 1 nguyên tử có 17 electron thì ion tạo ra từ nguyên tố đó có 17 neutron. (e) Nếu 1 nguyên tử có 17 electron thì ion tạo ra từ nguyên tố đó có 17 electron. Số phát biểu đúng là","opts":["1.","2.","3.","4."],"a":1},{"id":"S31","set":"Tự luyện gốc","num":31,"type":"short","text":"Nguyên tử của nguyên tố hydrogen được tạo nên từ mấy loại hạt cơ bản?.","answer":"2"},{"id":"S32","set":"Tự luyện gốc","num":32,"type":"short","text":"Nguyên tử của các nguyên tố (trừ hydrogen) được tạo nên từ mấy loại hạt cơ bản?.","answer":"3"},{"id":"S33","set":"Tự luyện gốc","num":33,"type":"short","text":"Một nguyên tử X có tổng điện tích âm ở lớp vỏ là -30,438.10-19C. Số electron có trong lớp vỏ nguyên tử X là bao nhiêu?.","answer":"19"},{"id":"S34","set":"Tự luyện gốc","num":34,"type":"short","text":"Khối lượng của proton gấp khoảng bao nhiêu lần khối lượng của electron (biết mp = 1,673.10-27 kg và me = 9,109.10-31 kg). (Kết quả làm tròn đến hàng đơn vị).","answer":"1837"},{"id":"S35","set":"Tự luyện gốc","num":35,"type":"short","text":"Magsenium (Mg) là nguyên tố kim loại kiềm thổ xếp thứ 8 về khối lượng trong các nguyên tố có mặt trên trái đất. Nguyên tử magsenium có điện tích hạt nhân là +12. Số electron trong nguyên tử này là bao nhiêu?.","answer":"12"},{"id":"S36","set":"Tự luyện gốc","num":36,"type":"short","text":"Hạt nhân nguyên tử X có 24 hạt, biết nguyên tử X có 12 hạt electron. Số hạt không mang điện trong X là bao nhiêu?.","answer":"12"},{"id":"S37","set":"Tự luyện gốc","num":37,"type":"short","text":"Một trong số những phản ứng phổ biến nhất giữa ion và phân tử ở các đám khí trong vũ trụ là: H2 + H +2 ⎯⎯ + → H + H3 . Biết nguyên tử H có 1 proton và 1 electron. Tổng số proton, neutron và electron của ion H 3+ là bao nhiêu?.","answer":"5"},{"id":"S38","set":"Tự luyện gốc","num":38,"type":"short","text":"Nguyên tử N có 7 proton, nguyên tử H có 1 proton. Tổng số hạt proton và electron trong ion NH +4 là bao nhiêu?.","answer":"21"},{"id":"S39","set":"Tự luyện gốc","num":39,"type":"short","text":"Nguyên tử X có 26 electron. Nguyên tử Y có điện tích hạt nhân bằng +35. Tổng số hạt mang điện trong phân tử XY3 là bao nhiêu?.","answer":"262"},{"id":"S40","set":"Tự luyện gốc","num":40,"type":"short","text":"Hợp kim chứa nguyên tố X nhẹ và bền, dùng chế tạo vỏ máy bay, tên lửa. Nguyên tố X còn được sử dụng trong xây dựng, ngành điện và đồ gia dụng. Nguyên tử của nguyên tố X có tổng số hạt (proton, electron, neutron) là 40. Tổng số hạt mang điện nhiều hơn tổng số hạt không mang điện là 12. Số khối của nguyên tử X là bao nhiêu?.","answer":"27"},{"id":"S41","set":"Tự luyện gốc","num":41,"type":"short","text":"Nguyên tử của nguyên tố X có tổng số hạt là 95. Số hạt mang điện nhiều hơn số hạt không mang điện là 25. Số khối của nguyên tử nguyên tố X bằng bao nhiêu?.","answer":"65"},{"id":"S42","set":"Tự luyện gốc","num":42,"type":"short","text":"Nguyên tử của nguyên tố X có tổng số hạt là 36. Số hạt mang điện gấp đôi số hạt không mang điện. Có bao nhiêu hạt electron trong nguyên tử X?.","answer":"12"},{"id":"S43","set":"Tự luyện gốc","num":43,"type":"short","text":"Một nguyên tử X bền có tổng số hạt (proton, neutron, electron) là 13. Số hạt mang điện nhiều hơn số hạt không mang điện trong nguyên tử X là bao nhiêu?.","answer":"3"},{"id":"S44","set":"Tự luyện gốc","num":44,"type":"short","text":"Nguyên tử X có 26 electron. Nguyên tử Y có điện tích hạt nhân bằng +35. Tổng số hạt mang điện trong phân tử XY2 là.","answer":"192"},{"id":"S45","set":"Tự luyện gốc","num":45,"type":"short","text":"Tổng số hạt proton, neutron, electron trong hai nguyên tử của nguyên tố X và Y là 96, trong đó có tổng số hạt mang điện nhiều hơn số hạt không mang điện là 32. Số hạt mang điện của nguyên tử Y nhiều hơn của X là 16. Tỉ lệ số proton của nguyên tử X so với số proton của nguyên tử Y bằng bao nhiêu? Tự học – TỰ LẬP – Tự do! ⭐️⭐️⭐️ (Thầy Phạm Thắng | TYHH) ⭐️⭐️⭐️","answer":"0,6"}];

const tips={m1:['Electron ở vỏ, proton + neutron ở hạt nhân.','Hạt nhân H-1 là ngoại lệ: không có neutron.','Khối lượng nguyên tử gần như tập trung ở hạt nhân.'],m2:['Đổi u → kg: nhân 1,6605×10⁻²⁷.','Số electron từ điện lượng: nₑ = |Q|/1,602×10⁻¹⁹.','1 mol chứa Nₐ ≈ 6,02×10²³ hạt.'],m3:['Đường kính nguyên tử lớn hơn hạt nhân khoảng 10⁴ lần.','Thể tích hình cầu phụ thuộc r³ nên sai 10 lần bán kính → sai 1000 lần thể tích.','Tinh thể có độ đặc khít f: D_thực = f·D_quả_cầu.'],m4:['Nguyên tử trung hòa: p=e=Z.','Số khối chỉ tính nucleon: A=p+n.','Cation mất e; anion nhận e.'],m5:['Đặt p=e=Z trước rồi mới lập hệ.','Tổng hạt: 2Z+N. Hiệu mang điện – không mang điện: 2Z−N.','Cộng hai phương trình tổng/hiệu thường ra 4Z rất nhanh.'],m6:['Tính từng nguyên tử rồi nhân hệ số trong công thức.','Ion phân tử: proton không đổi; chỉ electron thay đổi theo điện tích.','Với hai nguyên tử X,Y, dùng tổng và chênh số hạt mang điện để tìm Z.']};
function openModule(id){let m=modules.find(x=>x.id===id),t=tips[id];openModal(`<div class="formulaHero"><span class="tag" style="background:rgba(255,255,255,.12);color:#fff">${m.icon} CÔNG THỨC CỐT LÕI</span><h3>${m.title}</h3><div class="formulaBig">${m.formula}</div></div><div class="formulaGrid"><div class="fbox"><h4>🔎 Dấu hiệu dùng</h4><ul>${t.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="fbox"><h4>🧠 Cách nghĩ 3 bước + tư duy ngược</h4><ol><li>Khoanh đại lượng cuối cùng đề hỏi.</li><li>Hỏi ngược: muốn tìm nó thì ngay trước đó cần đại lượng nào?</li><li>Đi ngược tới dữ kiện đã cho, rồi giải xuôi và kiểm tra đơn vị.</li></ol></div><div class="fbox"><h4>⚠️ Bẫy hay sai</h4><p>Không nhầm <b>A</b> với khối lượng tuyệt đối; không đưa electron vào số khối; với ion phải chỉnh số electron theo điện tích.</p></div></div><div style="margin-top:14px"><button class="btn primary" onclick="closeModal();startPractice('${id}','all')">Luyện ngay 100 câu</button></div>`)}
function openModal(body){$('#modalHost').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><div style="display:flex;justify-content:flex-end"><button class="btn secondary" onclick="closeModal()">✕</button></div>${body}</div></div>`}function closeModal(){$('#modalHost').innerHTML=''}
function seeded(n){let x=n>>>0;return()=>{x=(Math.imul(1664525,x)+1013904223)>>>0;return x/4294967296}}
function shuf(a,r=Math.random){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function make(id,module,level,text,correct,alts,expl,rule){let vals=[String(correct),...alts.map(String)].filter((x,i,a)=>a.indexOf(x)===i);while(vals.length<4)vals.push('Không đủ dữ kiện '+vals.length);vals=vals.slice(0,4);let r=seeded(hash(id)),opts=shuf(vals,r),a=opts.indexOf(String(correct));return{id,module,level,type:'mc',text,opts,a,expl,rule,source:'Biến thể cùng dạng từ LIVE 1 – Thành phần nguyên tử'}}
function hash(s){let h=2166136261;for(let c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const BANK=[];
function genBank(){if(BANK.length)return;for(const m of modules)for(let i=0;i<100;i++)BANK.push(genQ(m.id,i,i>=50));}
function genQ(mid,i,adv){
  let Z=3+(i*7)%35;
  let N=Z+(i%5)-2;
  if(N<0) N=Z;
  let A=Z+N, k=i%5, L=adv?'Nâng cao':'Cơ bản', id=`${mid}-${adv?'A':'B'}-${i}`;
  if(mid==='m1'){
    const basic=[
      ['Hạt nằm ở vỏ nguyên tử và mang điện âm là?','electron',['proton','neutron','photon'],'Electron tạo nên lớp vỏ và mang điện tích tương đối −1.','e: vỏ, q = −1'],
      ['Hạt trong hạt nhân không mang điện là?','neutron',['electron','proton','photon'],'Neutron nằm trong hạt nhân và có điện tích 0.','n: hạt nhân, q = 0'],
      ['Hạt mang điện dương trong hạt nhân là?','proton',['electron','neutron','photon'],'Proton nằm trong hạt nhân và có điện tích tương đối +1.','p: hạt nhân, q = +1'],
      ['Ai phát hiện electron qua thí nghiệm tia âm cực?','J. J. Thomson',['E. Rutherford','J. Chadwick','N. Bohr'],'Tia âm cực bị lệch về cực dương cho thấy có hạt mang điện âm; Thomson phát hiện electron năm 1897.','1897 – Thomson – electron'],
      ['Thí nghiệm lá vàng của Rutherford cho thấy điều gì?','Nguyên tử có cấu tạo rỗng, hạt nhân rất nhỏ mang điện dương',['Nguyên tử đặc khít','Electron nằm trong hạt nhân','Neutron mang điện âm'],'Hầu hết hạt α đi thẳng, chỉ rất ít lệch mạnh: phần lớn thể tích nguyên tử là khoảng trống.','1911 – Rutherford – hạt nhân']
    ][k];
    return make(id,mid,L,basic[0],basic[1],basic[2],basic[3],basic[4]);
  }
  if(mid==='m2'){
    if(k===0){let u=18+(i%20),kg=u*1.6605e-27;return make(id,mid,L,`Một nguyên tử có khối lượng ${u} u. Khối lượng xấp xỉ theo kg là?`,kg.toExponential(3)+' kg',[(kg/10).toExponential(3)+' kg',(kg*10).toExponential(3)+' kg',(u/1.6605e27).toExponential(3)+' kg'],`1 u = 1,6605×10⁻²⁷ kg nên m=${u}×1,6605×10⁻²⁷ kg.`,'m(kg)=M(u)×1,6605×10⁻²⁷');}
    if(k===1){let e=5+(i%30),Q=e*1.602e-19;return make(id,mid,L,`Lớp vỏ có điện tích −${Q.toExponential(3)} C. Số electron gần nhất là?`,e,[e-1,e+1,e*2],`Chia độ lớn điện tích cho 1,602×10⁻¹⁹ C/e.`,'nₑ=|Q|/1,602×10⁻¹⁹');}
    if(k===2){let mol=[0.1,0.2,0.25,0.5][i%4],e=8+(i%20),n=mol*6.02e23*e;return make(id,mid,L,`${mol} mol nguyên tử X, mỗi nguyên tử có ${e} electron. Tổng số electron là?`,n.toExponential(3),[(n/10).toExponential(3),(n*10).toExponential(3),(mol*6.02e23).toExponential(3)],`Số nguyên tử = n·Nₐ, rồi nhân ${e} electron/nguyên tử.`,'N(e)=n·Nₐ·Z');}
    let ratio=Math.round(1.672e-27/9.109e-31);return make(id,mid,L,'Khối lượng proton xấp xỉ gấp bao nhiêu lần khối lượng electron?',ratio,[183,18370,1],`mₚ/mₑ≈1,672×10⁻²⁷ / 9,109×10⁻³¹ ≈ ${ratio}.`,'mₚ ≈ 1836–1837 mₑ');
  }
  if(mid==='m3'){
    if(k===0)return make(id,mid,L,'Đường kính nguyên tử cỡ 10⁻¹⁰ m, hạt nhân cỡ 10⁻¹⁴ m. Nguyên tử lớn hơn hạt nhân khoảng bao nhiêu lần?',10000,[1000,100,10],'10⁻¹⁰/10⁻¹⁴=10⁴=10000.','dNT/dHN≈10⁴');
    let r=(1.1+(i%8)*.05)*1e-8,M=24+(i%7)*8,m=M*1.6605e-24,V=4/3*Math.PI*r**3,d=m/V;
    if(k<=2)return make(id,mid,L,`Coi nguyên tử hình cầu, r=${(r/1e-8).toFixed(2)}×10⁻⁸ cm, M=${M} u. Khối lượng riêng gần nhất?`,d.toFixed(2)+' g/cm³',[(d/10).toFixed(2)+' g/cm³',(d*10).toFixed(2)+' g/cm³',(d*0.74).toFixed(2)+' g/cm³'],'Đổi M u sang gam, tính V=4πr³/3 rồi D=m/V.','D=m/V; V=4πr³/3');
    let pack=[0.68,0.74,0.75][i%3],real=d*pack;return make(id,mid,L,`Khối lượng riêng quả cầu nguyên tử tính được ${d.toFixed(2)} g/cm³, độ đặc khít tinh thể ${(pack*100).toFixed(0)}%. Khối lượng riêng tinh thể là?`,real.toFixed(2)+' g/cm³',[(d/pack).toFixed(2)+' g/cm³',(d*(1-pack)).toFixed(2)+' g/cm³',d.toFixed(2)+' g/cm³'],`Chỉ ${(pack*100).toFixed(0)}% thể tích có vật chất: D_thực = ${pack}·D_quả_cầu.`,'D_thực=f·D_hình_cầu');
  }
  if(mid==='m4'){
    if(k===0)return make(id,mid,L,`Nguyên tử trung hòa có Z=${Z}. Số proton và electron là?`,`${Z} và ${Z}`,[`${Z} và ${Z+1}`,`${N} và ${Z}`,`${Z-1} và ${Z}`],`Z là số proton; trung hòa nên e=p=${Z}.`,'p=e=Z');
    if(k===1)return make(id,mid,L,`Nguyên tử có A=${A}, Z=${Z}. Số neutron là?`,N,[Z,A,N+1,N-1],`N=A−Z=${A}−${Z}=${N}.`,'A=Z+N');
    if(k===2){let q=1+i%3;return make(id,mid,L,`Ion X${q}⁺ có Z=${Z}. Số electron là?`,Z-q,[Z,Z+q,Z-q+1,Z-q-1],`Cation ${q}+ đã mất ${q}e nên e=Z−${q}.`,'cation q⁺: e=Z−q');}
    return make(id,mid,L,`Nguyên tử X có ${Z} proton và ${N} neutron. Số khối A bằng?`,A,[Z,N,2*Z+N,A+1],`Số khối chỉ gồm proton và neutron: A=${Z}+${N}=${A}.`,'A=p+n');
  }
  if(mid==='m5'){
    if(k===0){let total=2*Z+N,diff=2*Z-N;return make(id,mid,L,`Nguyên tử X có p+n+e=${total}, số hạt mang điện nhiều hơn không mang điện ${diff}. Z bằng?`,Z,[Z-1,Z+1,N,Math.round(total/3)],`2Z+N=${total}; 2Z−N=${diff}. Cộng hai phương trình: 4Z=${total+diff}.`,'T=2Z+N; Δ=2Z−N');}
    if(k===1){let total=3*Z;return make(id,mid,L,`Nguyên tử có tổng ${total} hạt và số hạt mang điện gấp đôi số hạt không mang điện. Số electron là?`,Z,[Z-1,Z+1,2*Z],`2Z=2N ⇒ Z=N; 2Z+N=3Z=${total} ⇒ Z=${Z}.`,'2Z=2N ⇒ Z=N');}
    if(k===2){let pct=((N/(2*Z))*100).toFixed(2);return make(id,mid,L,`Một nguyên tử có Z=${Z}, N=${N}. Số hạt không mang điện bằng bao nhiêu % số hạt mang điện?`,pct+'%',[((N/Z)*100).toFixed(2)+'%',((2*N/Z)*100).toFixed(2)+'%',((Z/(2*N))*100).toFixed(2)+'%'],`Hạt mang điện=p+e=2Z=${2*Z}; phần trăm=N/(2Z)×100.`,'% = N/(2Z)×100');}
    let total=2*Z+N;return make(id,mid,L,`Tổng p,n,e của nguyên tử là ${total}. Nếu Z=${Z}, số hạt không mang điện là?`,N,[Z,total-N,N+2],`N=T−2Z=${total}−${2*Z}=${N}.`,'N=T−2Z');
  }
  if(k===0){let zX=8+(i%12),zY=9+(i%15),sum=2*zX+2*(2*zY);return make(id,mid,L,`Phân tử XY₂ gồm nguyên tử trung hòa X có Z=${zX}, Y có Z=${zY}. Tổng số hạt mang điện (p+e) trong một phân tử là?`,sum,[sum/2,sum+2*zY,sum-2*zY],'Mỗi nguyên tử trung hòa có p+e=2Z. Tổng =2Z_X+2·(2Z_Y).','Hạt mang điện phân tử = Σ2Z·hệ số');}
  if(k===1){let p=11,e=10;return make(id,mid,L,'Ion NH₄⁺ (N có Z=7, H có Z=1) có tổng số proton và electron là?',p+e,[2*p,p,p+e+1],'Tổng proton=7+4=11; ion +1 có 10 electron; tổng=21.','ion q⁺: e=ΣZ−q');}
  if(k===2){let sum=262;return make(id,mid,L,'X có Z=26, Y có Z=35. Tổng số hạt mang điện trong phân tử XY₃ là?',sum,[192,122,332],'X đóng góp 2·26=52 hạt mang điện; 3Y đóng góp 3·70=210; tổng 262.','Σ(p+e)=Σ2Z');}
  return make(id,mid,L,'Hai nguyên tử X,Y có pX+pY=32 và số hạt mang điện của Y nhiều hơn X là 16. Tỉ lệ pX/pY bằng?','0.6',['0.5','0.8','1.5'],'2pY−2pX=16 ⇒ pY−pX=8; kết hợp pX+pY=32 ⇒ pX=12,pY=20.','Giải hệ tổng và hiệu proton');
}
let quiz={list:[],idx:0,sel:null,checked:false,title:''};
function renderPractice(){genBank();$('#v-practice').innerHTML=`<div class="pagehead"><div><h2>Luyện 600 câu</h2><p>Mỗi mô-đun: 50 câu cơ bản + 50 câu nâng cao. Với bài tính toán, app có Phân tích đề + Tư duy ngược trước khi làm; sai câu nào sẽ hiện đáp án đúng, giải thích bản chất và chuỗi 5 câu tìm lỗ hổng.</p></div></div><div class="grid g3">${modules.map((m,i)=>`<div class="card module"><div class="num">${i+1}</div><h3>${m.title}</h3><div style="display:flex;gap:7px;flex-wrap:wrap"><span class="tag green">50 cơ bản</span><span class="tag purple">50 nâng cao</span></div><p>${m.focus}</p><div class="actions"><button class="btn secondary" onclick="startPractice('${m.id}','basic')">50 cơ bản</button><button class="btn purpleBtn" onclick="startPractice('${m.id}','advanced')">50 nâng cao</button><button class="btn primary" onclick="startPractice('${m.id}','all')">100 câu</button></div></div>`).join('')}</div>`}
function startPractice(mid,tier){genBank();let list=BANK.filter(q=>q.module===mid&&(tier==='all'||(tier==='basic'?q.level==='Cơ bản':q.level==='Nâng cao')));quiz={list,idx:0,sel:null,checked:false,title:modules.find(x=>x.id===mid).title};navQuiz()}
function navQuiz(){$$('.view').forEach(x=>x.classList.remove('active'));$('#v-quiz').classList.add('active');renderQuiz();window.scrollTo(0,0)}
function isCalcQ(q){
  if(!q)return false;
  if(['m2','m3','m4','m5','m6'].includes(q.module))return true;
  const t=(q.text||'').toLowerCase();
  return /(tính|bao nhiêu|xác định|số khối|khối lượng|điện tích|bán kính|khối lượng riêng|tổng số hạt|số proton|số neutron|số electron|amu|mol|phân tử|ion)/i.test(t);
}
function reverseThinking(q){
  const t=(q.text||'').toLowerCase(),m=q.module;
  if(m==='m2'||/amu|khối lượng|điện tích.*electron|mol/.test(t)){
    if(/điện tích|electron/.test(t)) return {goal:'Đích cần tìm thường là số electron hoặc điện lượng.',chain:'Số e  ←  |Q| / |qₑ|  ←  điện lượng Q đề cho',steps:['Khoanh đại lượng cần tìm: số e hay Q.','Dùng |qₑ| = 1,602×10⁻¹⁹ C làm cầu nối.','Kiểm tra số electron phải là số nguyên hợp lí.'],trap:'Đổi dấu điện tích thành độ lớn trước khi chia; không nhầm C với điện tích tương đối.'};
    return {goal:'Đích cần tìm là khối lượng theo kg/g hoặc theo u.',chain:'m(kg)  ←  m(u) × 1,6605×10⁻²⁷',steps:['Xác định đơn vị đích.','Chọn chiều đổi đơn vị: u → kg thì nhân; kg → u thì chia.','Kiểm tra bậc độ lớn: một nguyên tử phải cực nhỏ.'],trap:'Sai chiều đổi đơn vị sẽ làm kết quả lệch rất nhiều bậc 10.'};
  }
  if(m==='m3'||/bán kính|khối lượng riêng|thể tích|đường kính|kích thước/.test(t)){
    return {goal:'Đích thường là D, r hoặc tỉ số kích thước.',chain:'D  ←  m / V  ←  m và r  ←  V = 4πr³/3',steps:['Bắt đầu từ đại lượng đề hỏi: nếu hỏi D thì cần m và V; nếu hỏi r thì đảo công thức từ V.','Đổi toàn bộ r về cùng hệ đơn vị trước khi lập phương.','Nếu có độ đặc khít f, xác định rõ D_quả cầu hay D_tinh thể.'],trap:'Bán kính xuất hiện dưới lũy thừa 3: sai 10 lần r sẽ làm V sai 1000 lần.'};
  }
  if(m==='m4'||/số khối|điện tích hạt nhân|\bz\b|proton|neutron|electron|ion/.test(t)){
    return {goal:'Đích là Z, A, N, p hoặc e.',chain:'Đại lượng cần tìm  ←  p=e=Z và A=Z+N',steps:['Nếu hỏi Z, hãy tìm p hoặc e trước.','Nếu hỏi N, cần A và Z rồi dùng N=A−Z.','Nếu là ion, chỉ e thay đổi; p và N không đổi.'],trap:'Không đưa electron vào số khối A; với ion đừng dùng e=Z một cách máy móc.'};
  }
  if(m==='m5'||/tổng số hạt|hạt mang điện|không mang điện|gấp|nhiều hơn|kém/.test(t)){
    return {goal:'Đích thường là Z hoặc A từ các quan hệ tổng – hiệu – tỉ lệ.',chain:'Z  ←  hệ phương trình  ←  T=2Z+N và MĐ=2Z',steps:['Đặt p=e=Z trước.','Dịch từng câu chữ thành phương trình: tổng, hiệu hoặc tỉ lệ.','Giải hệ rồi mới suy A=Z+N nếu đề hỏi số khối.'],trap:'“Hạt mang điện” gồm cả proton và electron nên bằng 2Z, không phải Z.'};
  }
  if(m==='m6'||/phân tử|hợp chất|xy|mx|nh4|h2o/.test(t)){
    return {goal:'Đích là tổng hạt hoặc Z của các nguyên tử trong một phân tử/ion.',chain:'Tổng phân tử  ←  Σ(hệ số × hạt của từng nguyên tử)  ←  p,n,e từng nguyên tử',steps:['Tách công thức thành từng nguyên tố và hệ số.','Tính p,n,e của một nguyên tử trước, rồi nhân hệ số.','Nếu là ion phân tử, chỉnh tổng electron theo điện tích ở bước cuối.'],trap:'Đừng chỉnh proton theo điện tích ion; điện tích chỉ làm thay đổi số electron.'};
  }
  return {goal:'Xác định chính xác đại lượng đề hỏi.',chain:'Đại lượng cần tìm  ←  công thức trực tiếp  ←  dữ kiện đề cho',steps:['Gạch chân dữ kiện có đơn vị.','Viết công thức trước khi thay số.','Đối chiếu điều kiện và đơn vị để tự kiểm.'],trap:'Không bắt đầu bằng việc thử đáp án; hãy đi từ đích về dữ kiện.'};
}
function analysisHTML(q){
  if(!isCalcQ(q))return '';
  const r=reverseThinking(q);
  return `<details class="analysisBox" open><summary>🧭 Phân tích đề · Tư duy ngược</summary><div class="analysisBody"><div class="analysisGrid"><div class="analysisCard"><h4>1. Đọc đề theo chiều thuận</h4><p><b>Đề hỏi:</b> ${esc(r.goal)}</p><ol class="analysisSteps">${r.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div><div class="analysisCard reverse"><h4>2. Tư duy ngược từ đích</h4><p>Đừng hỏi “dùng công thức nào trước?”; hãy hỏi <b>“Muốn có đáp án cuối, ngay trước đó mình cần biết gì?”</b></p><div class="analysisArrow">${esc(r.chain)}</div><p>Đi ngược chuỗi đến khi chạm đúng dữ kiện đề đã cho, rồi mới giải theo chiều xuôi.</p></div></div><div class="analysisHint"><b>⚠ Bẫy cần kiểm:</b> ${esc(r.trap)}</div></div></details>`;
}
function renderQuiz(){let q=quiz.list[quiz.idx];if(!q){$('#v-quiz').innerHTML='<div class="card">Không có câu hỏi.</div>';return}$('#v-quiz').innerHTML=`<div class="pagehead"><div><button class="btn secondary" onclick="nav('practice')">← Phòng luyện</button><h2>${esc(quiz.title)}</h2></div><span class="tag blue">${quiz.idx+1}/${quiz.list.length}</span></div><div class="qwrap card"><div class="qmeta"><span class="tag ${q.level==='Nâng cao'?'purple':'green'}">${q.level||q.set}</span><span class="tag amber">${esc(q.source||'Nguồn file')}</span></div><div class="qtext">${esc(q.text)}</div>${analysisHTML(q)}${q.type==='short'?`<input id="shortAns" style="width:100%;height:52px;border:1px solid var(--line);border-radius:12px;padding:0 13px" placeholder="Nhập đáp án...">`:q.opts.map((o,i)=>`<button class="opt ${quiz.sel===i?'sel':''} ${quiz.checked&&i===q.a?'ok':''} ${quiz.checked&&quiz.sel===i&&i!==q.a?'bad':''}" onclick="choose(${i})" ${quiz.checked?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}<div id="fb">${quiz.checked?feedbackHTML(q):''}</div><div class="actionsRow"><button class="btn secondary" onclick="prevQ()" ${quiz.idx===0?'disabled':''}>← Trước</button><div><button class="btn primary" onclick="checkQ()" ${quiz.checked?'disabled':''}>Kiểm tra (Enter)</button> <button class="btn success" onclick="nextQ()" ${!quiz.checked?'disabled':''}>Tiếp →</button></div></div></div>`}
function choose(i){if(quiz.checked)return;quiz.sel=i;renderQuiz()}
function norm(s){return String(s).trim().toLowerCase().replace(/\s+/g,'').replace('.',',')}
function isCorrect(q){if(q.type==='short'){let el=$('#shortAns');return el&&norm(el.value)===norm(q.answer)}return quiz.sel===q.a}
function checkQ(){let q=quiz.list[quiz.idx];if(q.type==='mc'&&quiz.sel===null){toast('Chọn một đáp án trước.');return}let ok=isCorrect(q);quiz.checked=true;st.attempted++;if(ok){st.correct++;st.xp+=10}else{st.xp+=2;let sel=q.type==='short'?($('#shortAns')?.value||''):quiz.sel;st.wrong.unshift({id:Date.now()+Math.random(),qid:q.id,text:q.text,module:q.module||'source',selected:sel,when:new Date().toLocaleString()});if(st.wrong.length>150)st.wrong.length=150}if(q.module)st.done[q.module]=Math.min(100,(st.done[q.module]||0)+1);save();updateTop();renderQuiz();if(!ok)setTimeout(()=>openRemedy(q),250)}
function sourceRule(q){let t=q.text.toLowerCase();if(t.includes('số khối'))return 'A = Z + N; nguyên tử trung hòa có p = e = Z.';if(t.includes('điện tích')||t.includes('electron'))return 'p = e = Z với nguyên tử trung hòa; |qₑ| = 1,602×10⁻¹⁹ C.';if(t.includes('khối lượng')||t.includes('amu'))return '1 u = 1,6605×10⁻²⁷ kg; mₚ≈mₙ≈1u; mₑ≈0,00055u.';if(t.includes('kích thước')||t.includes('đường kính'))return 'dNT≈10⁻¹⁰m; dHN≈10⁻¹⁴m ⇒ tỉ lệ ≈10⁴.';return 'Electron ở vỏ; proton và neutron ở hạt nhân; nguyên tử trung hòa nên p=e.'}
function qExpl(q){return q.expl||`Đưa bài về quan hệ nền: ${sourceRule(q)} Sau đó đối chiếu đúng đại lượng đề hỏi, không thay số theo cảm tính.`}
function feedbackHTML(q){let ok=isCorrect(q),ans=q.type==='short'?q.answer:q.opts[q.a],r=isCalcQ(q)?reverseThinking(q):null;return `<div class="feedback ${ok?'explain':'warning'}"><b>${ok?'✓ Chính xác':'✗ Chưa đúng'}</b><p><b>Đáp án đúng:</b> ${esc(ans)}</p><p><b>Giải thích bản chất:</b> ${esc(qExpl(q))}</p><p><b>Công thức/quy tắc:</b> ${esc(q.rule||sourceRule(q))}</p>${r?`<div class="analysisHint" style="margin-top:10px"><b>↩ Kiểm lại bằng tư duy ngược:</b> ${esc(r.chain)}</div>`:''}</div>`}
function nextQ(){if(!quiz.checked)return;if(quiz.idx>=quiz.list.length-1){toast('Hoàn thành lượt luyện!');nav('report');return}quiz.idx++;quiz.sel=null;quiz.checked=false;renderQuiz()}
function prevQ(){if(quiz.idx>0){quiz.idx--;quiz.sel=null;quiz.checked=false;renderQuiz()}}
function openRemedy(q){let steps=[['1. Nhận diện',`Đề đang hỏi trực tiếp đại lượng nào?`,['Số hạt/điện tích/khối lượng liên quan','Một kiến thức không liên quan','Không cần đọc dữ kiện'],0],['2. Chọn quan hệ',`Quy tắc nào nên viết trước?`,[q.rule||sourceRule(q),'Đoán đáp án từ lựa chọn','Nhân tất cả số liệu'],0],['3. Kiểm tra bản chất','Với nguyên tử trung hòa, p và e có quan hệ gì?',['p = e','p = n','e = n'],0],['4. Tránh bẫy','Số khối A có tính electron không?',['Không, A=p+n','Có, A=p+n+e','Chỉ tính electron'],0],['5. Chốt lỗi','Cách hạn chế sai lặp lại?',['Viết công thức trước rồi mới thay số','Nhìn đáp án và đoán','Bỏ qua đơn vị'],0]];let n=0;function show(){let s=steps[n];openModal(`<span class="tag purple">Chuỗi tìm lỗ hổng ${n+1}/5</span><h3>${s[0]}</h3><p>${s[1]}</p>${s[2].map((x,i)=>`<button class="opt" onclick="remedyPick(${i})"><span class="letter">${'ABC'[i]}</span>${x}</button>`).join('')}`)}window._remedy=(i)=>{if(i!==steps[n][3]){toast('Chưa đúng. Hãy quay lại bản chất của dữ kiện.');return}n++;if(n>=5){closeModal();toast('Đã hoàn thành chuỗi chữa lỗi.');return}show()};show()}
window.remedyPick=i=>window._remedy(i);
function renderSource(){let rev=SOURCE.filter(x=>x.set==='Ôn tập gốc'),self=SOURCE.filter(x=>x.set==='Tự luyện gốc');$('#v-source').innerHTML=`<div class="pagehead"><div><h2>Bài gốc từ file LIVE 1</h2><p>Giữ cấu trúc câu hỏi của tài liệu: 30 câu ôn tập và 45 câu tự luyện, gồm trắc nghiệm và trả lời ngắn.</p></div></div><div class="grid g2"><div class="card"><span class="tag blue">30 câu</span><h3>Câu hỏi ôn tập</h3><p class="muted">Hạt cơ bản, khối lượng – điện tích, Z/A, tổng số hạt, kích thước.</p><button class="btn primary" onclick="startSource('Ôn tập gốc')">Làm 30 câu</button></div><div class="card"><span class="tag purple">45 câu</span><h3>Bài tập tự luyện</h3><p class="muted">30 câu trắc nghiệm + 15 câu trả lời ngắn/tổng hợp.</p><button class="btn purpleBtn" onclick="startSource('Tự luyện gốc')">Làm 45 câu</button></div></div>`}
function sourceToQ(x){return {...x,level:x.type==='short'?'Nâng cao':'Gốc',source:'Câu gốc từ file LIVE 1 – Thành phần nguyên tử',module:'source',rule:sourceRule(x),expl:`Câu này được xử lí trực tiếp bằng kiến thức trong file: ${sourceRule(x)}`}}
function startSource(set){quiz={list:SOURCE.filter(x=>x.set===set).map(sourceToQ),idx:0,sel:null,checked:false,title:set};navQuiz()}
function renderWrong(){let items=st.wrong.length?st.wrong.map((w,i)=>`<div class="wrongitem"><span class="tag red">Lỗi ${i+1}</span><p><b>${esc(w.text)}</b></p><small class="muted">${esc(w.when)}</small><div style="margin-top:8px"><button class="btn secondary" onclick="wrongExplain(${i})">Xem công thức chữa lỗi</button></div></div>`).join(''):'<div class="card">Chưa có câu sai.</div>';$('#v-wrong').innerHTML=`<div class="pagehead"><div><h2>Sổ câu sai</h2><p>Câu sai được lưu tự động trên thiết bị.</p></div><button class="btn danger" onclick="if(confirm('Xóa sổ câu sai?')){st.wrong=[];save();renderWrong();updateTop()}">Xóa sổ</button></div>${items}`}
function wrongExplain(i){let w=st.wrong[i],q=BANK.find(x=>x.id===w.qid)||SOURCE.map(sourceToQ).find(x=>x.id===w.qid);openModal(`<span class="tag red">Chữa lỗi</span><h3>${esc(w.text)}</h3><div class="fbox"><b>Công thức cần quay lại</b><p>${esc(q? (q.rule||sourceRule(q)) :'p=e=Z; A=Z+N; T=2Z+N')}</p></div><p><b>Cách tự kiểm:</b> đại lượng đề hỏi là gì → công thức nào nối trực tiếp dữ kiện → đơn vị đã đúng chưa?</p>`)}
function renderReport(){let a=st.attempted?Math.round(st.correct/st.attempted*100):0;$('#v-report').innerHTML=`<div class="pagehead"><div><h2>Báo cáo tiến độ</h2><p>Theo dõi mức độ thành thạo của chuyên đề.</p></div></div><div class="grid g4"><div class="card stat"><strong>${st.attempted}</strong><span>lượt trả lời</span></div><div class="card stat"><strong>${st.correct}</strong><span>câu đúng</span></div><div class="card stat"><strong>${a}%</strong><span>độ chính xác</span></div><div class="card stat"><strong>${st.wrong.length}</strong><span>câu trong sổ sai</span></div></div><div class="card" style="margin-top:15px"><h3>Mastery theo dạng</h3>${modules.map(m=>`<div style="display:grid;grid-template-columns:260px 1fr 45px;gap:10px;align-items:center;margin:12px 0"><span>${m.title}</span><div class="progress"><span style="width:${Math.min(100,st.done[m.id]||0)}%"></span></div><b>${Math.min(100,st.done[m.id]||0)}%</b></div>`).join('')}</div>`}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#v-quiz').classList.contains('active')){e.preventDefault();quiz.checked?nextQ():checkQ()}});genBank();updateTop();renderHome();
</script></body></html>
